  <!-- Japanese Kana Aesthetic Accent -->
  <text x="60" y="100" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="4" font-weight="bold">EXHIBITION ITEM #9 / 20</text>
  <text x="60" y="130" fill="#a1a1aa" font-family="sans-serif" font-size="14" letter-spacing="2">BLEACH &amp; MANGAART COLLECTION</text>
  
  <!-- Center Main Badge -->
  <circle cx="600" cy="380" r="140" fill="#18181b" stroke="#f59e0b" stroke-width="3" opacity="0.9"/>
  <text x="600" y="360" fill="#ffffff" font-family="'League Spartan', 'Syne', sans-serif" font-size="64" font-weight="900" text-anchor="middle">#9</text>
  <text x="600" y="410" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">MANGA ART</text>

  <!-- Title & Path Info -->
