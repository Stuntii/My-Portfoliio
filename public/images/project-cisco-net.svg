<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#020617" />
  <rect x="60" y="60" width="1080" height="555" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  
  <text x="600" y="110" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="24" text-anchor="middle">CISCO ENTERPRISE NETWORK &amp; INFRASTRUCTURE ARCHITECTURE</text>

  <!-- Network Nodes -->
  <g transform="translate(200, 180)">
    <!-- Core Router -->
    <rect x="320" y="20" width="160" height="70" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <text x="400" y="60" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18" text-anchor="middle">Core Router</text>

    <!-- Switches -->
    <rect x="120" y="180" width="140" height="60" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <text x="190" y="215" fill="#e0f2fe" font-family="sans-serif" font-size="14" text-anchor="middle">Dist Switch 01</text>

    <rect x="520" y="180" width="140" height="60" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <text x="590" y="215" fill="#e0f2fe" font-family="sans-serif" font-size="14" text-anchor="middle">Dist Switch 02</text>

    <!-- End Points -->
    <rect x="20" y="320" width="100" height="50" rx="8" fill="#334155" />
    <text x="70" y="350" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">VLAN 10</text>

    <rect x="180" y="320" width="100" height="50" rx="8" fill="#334155" />
    <text x="230" y="350" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">VLAN 20</text>

    <rect x="520" y="320" width="100" height="50" rx="8" fill="#334155" />
    <text x="570" y="350" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">VLAN 30</text>

    <!-- Lines -->
    <line x1="400" y1="90" x2="190" y2="180" stroke="#38bdf8" stroke-width="3" />
    <line x1="400" y1="90" x2="590" y2="180" stroke="#38bdf8" stroke-width="3" />
    <line x1="190" y1="240" x2="70" y2="320" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="190" y1="240" x2="230" y2="320" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="590" y1="240" x2="570" y2="320" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" />
  </g>
</svg>
