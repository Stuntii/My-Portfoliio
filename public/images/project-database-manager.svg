<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0b1329" />
  <rect x="60" y="60" width="1080" height="555" rx="16" fill="#111c38" stroke="#3b82f6" stroke-width="2" />
  <text x="600" y="110" fill="#60a5fa" font-family="monospace" font-weight="bold" font-size="22" text-anchor="middle">RELATIONAL DATABASE MANAGER &amp; SQL SCHEMA DESIGNER</text>

  <!-- ERD Diagram Mockup -->
  <g transform="translate(100, 150)">
    <!-- Table 1: Users -->
    <rect x="0" y="0" width="260" height="220" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
    <rect x="0" y="0" width="260" height="40" rx="10" fill="#1d4ed8" />
    <text x="130" y="26" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">dbo.Users</text>
    <text x="20" y="70" fill="#f8fafc" font-family="monospace" font-size="13">🔑 UserId (PK, int)</text>
    <text x="20" y="100" fill="#94a3b8" font-family="monospace" font-size="13">  Email (nvarchar)</text>
    <text x="20" y="130" fill="#94a3b8" font-family="monospace" font-size="13">  Role (nvarchar)</text>
    <text x="20" y="160" fill="#94a3b8" font-family="monospace" font-size="13">  CreatedAt (datetime2)</text>

    <!-- Table 2: Projects -->
    <rect x="400" y="0" width="280" height="220" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <rect x="400" y="0" width="280" height="40" rx="10" fill="#7e22ce" />
    <text x="540" y="26" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">dbo.Projects</text>
    <text x="420" y="70" fill="#f8fafc" font-family="monospace" font-size="13">🔑 ProjectId (PK, int)</text>
    <text x="420" y="100" fill="#e9d5ff" font-family="monospace" font-size="13">🔗 UserId (FK, int)</text>
    <text x="420" y="130" fill="#94a3b8" font-family="monospace" font-size="13">  Title (nvarchar)</text>
    <text x="420" y="160" fill="#94a3b8" font-family="monospace" font-size="13">  TechStack (nvarchar)</text>

    <!-- Connection Line -->
    <line x1="260" y1="70" x2="400" y2="100" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 6" />

    <!-- SQL Query Terminal Below -->
    <rect x="0" y="260" width="880" height="150" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
    <text x="20" y="295" fill="#22c55e" font-family="monospace" font-size="14">SELECT u.Email, COUNT(p.ProjectId) AS TotalProjects</text>
    <text x="20" y="325" fill="#22c55e" font-family="monospace" font-size="14">FROM dbo.Users u INNER JOIN dbo.Projects p ON u.UserId = p.UserId</text>
    <text x="20" y="355" fill="#22c55e" font-family="monospace" font-size="14">GROUP BY u.Email HAVING COUNT(p.ProjectId) &gt; 0 ORDER BY TotalProjects DESC;</text>
  </g>
</svg>
