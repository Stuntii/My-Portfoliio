<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#brandGrad)" />
  
  <!-- Grid guidelines for graphic design style -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200 M 0 600 H 1200" stroke="#e7e5e4" stroke-width="1" />
  <path d="M 200 0 V 675 M 400 0 V 675 M 600 0 V 675 M 800 0 V 675 M 1000 0 V 675" stroke="#e7e5e4" stroke-width="1" />

  <!-- Main Logo Mark Blueprint -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="450" height="430" rx="20" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
    <circle cx="225" cy="215" r="140" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 6" />
    <polygon points="225,85 340,305 110,305" fill="#4f46e5" opacity="0.9" />
    <circle cx="225" cy="215" r="50" fill="#ec4899" opacity="0.8" />
    <text x="225" y="390" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="22" text-anchor="middle">HORIZON BRAND SYSTEM</text>
  </g>

  <!-- Color Palette Swatches -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="500" height="200" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
    <text x="30" y="45" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="18">Primary &amp; Accent Palette</text>
    <rect x="30" y="70" width="80" height="100" rx="8" fill="#4f46e5" /><text x="30" y="185" fill="#78716c" font-family="monospace" font-size="12">#4F46E5</text>
    <rect x="125" y="70" width="80" height="100" rx="8" fill="#a855f7" /><text x="125" y="185" fill="#78716c" font-family="monospace" font-size="12">#A855F7</text>
    <rect x="220" y="70" width="80" height="100" rx="8" fill="#ec4899" /><text x="220" y="185" fill="#78716c" font-family="monospace" font-size="12">#EC4899</text>
    <rect x="315" y="70" width="80" height="100" rx="8" fill="#0f172a" /><text x="315" y="185" fill="#78716c" font-family="monospace" font-size="12">#0F172A</text>
  </g>

  <!-- Typography Scale -->
  <g transform="translate(600, 350)">
    <rect x="0" y="0" width="500" height="200" rx="16" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" />
    <text x="30" y="45" fill="#1c1917" font-family="sans-serif" font-weight="bold" font-size="28">Aa — Display Heading</text>
    <text x="30" y="85" fill="#44403c" font-family="sans-serif" font-weight="semibold" font-size="20">Syne &amp; Plus Jakarta Sans Pairing</text>
    <text x="30" y="125" fill="#78716c" font-family="sans-serif" font-size="14">Geometric typography with mathematical grid balance and optical tracking.</text>
  </g>
</svg>
