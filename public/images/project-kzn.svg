  <!-- Line Chart Path -->
  <path d="M 380 350 Q 450 320, 520 250 T 660 210 T 800 180" fill="none" stroke="#a855f7" stroke-width="4" />
  <path d="M 380 350 Q 450 320, 520 250 T 660 210 T 800 180 L 800 370 L 380 370 Z" fill="#a855f7" opacity="0.15" />
  
