<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0f172a" />
  <rect x="50" y="50" width="1100" height="575" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <rect x="50" y="50" width="1100" height="45" rx="16" fill="#0f172a" />
  <circle cx="80" cy="72" r="6" fill="#ef4444" /><circle cx="100" cy="72" r="6" fill="#f59e0b" /><circle cx="120" cy="72" r="6" fill="#10b981" />
  <text x="600" y="78" fill="#94a3b8" font-family="monospace" font-size="15" text-anchor="middle">ASP.NET Core C# Enterprise Solution &amp; Microservices</text>

  <!-- Left C# Code Window -->
  <rect x="80" y="120" width="500" height="475" rx="10" fill="#090d16" stroke="#334155" stroke-width="1" />
  <text x="100" y="155" fill="#38bdf8" font-family="monospace" font-size="14">[ApiController]</text>
  <text x="100" y="180" fill="#38bdf8" font-family="monospace" font-size="14">[Route("api/v1/[controller]")]</text>
  <text x="100" y="210" fill="#f43f5e" font-family="monospace" font-size="14">public class <tspan fill="#facc15">EnterpriseSystemController</tspan> : ControllerBase</text>
  <text x="100" y="235" fill="#e2e8f0" font-family="monospace" font-size="14">{</text>
  <text x="120" y="260" fill="#f43f5e" font-family="monospace" font-size="14">    private readonly <tspan fill="#38bdf8">IDatabaseManager</tspan> _db;</text>
  <text x="120" y="290" fill="#38bdf8" font-family="monospace" font-size="14">    [HttpGet("analytics")]</text>
  <text x="120" y="315" fill="#f43f5e" font-family="monospace" font-size="14">    public async <tspan fill="#38bdf8">Task&lt;IActionResult&gt;</tspan> GetMetrics()</text>
  <text x="120" y="340" fill="#e2e8f0" font-family="monospace" font-size="14">    {</text>
  <text x="140" y="365" fill="#f43f5e" font-family="monospace" font-size="14">        var data = await _db.QueryAsync();</text>
  <text x="140" y="390" fill="#f43f5e" font-family="monospace" font-size="14">        return Ok(new { status = "Success", data });</text>
  <text x="120" y="415" fill="#e2e8f0" font-family="monospace" font-size="14">    }</text>
  <text x="100" y="440" fill="#e2e8f0" font-family="monospace" font-size="14">}</text>

  <!-- Right React Live App Monitor -->
  <rect x="620" y="120" width="500" height="475" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
  <rect x="650" y="150" width="440" height="180" rx="8" fill="#1e1b4b" />
  <text x="670" y="185" fill="#a5b4fc" font-family="sans-serif" font-weight="bold" font-size="18">Real-Time Microservice Mesh</text>
  <path d="M 670 280 L 730 220 L 790 250 L 850 200 L 910 240 L 970 190" fill="none" stroke="#6366f1" stroke-width="3" />

  <rect x="650" y="350" width="200" height="110" rx="8" fill="#1e293b" />
  <text x="670" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12">Throughput</text>
  <text x="670" y="420" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="24">12,450 req/s</text>

  <rect x="870" y="350" width="220" height="110" rx="8" fill="#1e293b" />
  <text x="890" y="380" fill="#94a3b8" font-family="sans-serif" font-size="12">Database Load</text>
  <text x="890" y="420" fill="#4ade80" font-family="sans-serif" font-weight="bold" font-size="24">1.2ms Avg SQL</text>
</svg>
